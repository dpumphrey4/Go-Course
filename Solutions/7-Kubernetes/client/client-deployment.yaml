apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-client
  template:
    metadata:
      labels:
        app: my-client
    spec:
      containers:
      - name: my-client
        image: my-client:1.0
        imagePullPolicy: Never
        ports:
        - containerPort: 3000